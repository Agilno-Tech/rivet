name: Rivet documentation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built site to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}-${{ inputs.publish || false }}
  cancel-in-progress: ${{ !inputs.publish }}

jobs:
  build:
    # Release PRs are verified through explicit dispatch; their PR event may still exist.
    if: >-
      ${{ !(github.event_name == 'pull_request'
        && github.repository == 'Agilno-Tech/rivet'
        && github.event.pull_request.user.login == 'github-actions[bot]'
        && github.event.pull_request.head.repo.full_name == 'Agilno-Tech/rivet'
        && github.event.pull_request.base.repo.full_name == 'Agilno-Tech/rivet'
        && github.event.pull_request.base.ref == 'main'
        && github.event.pull_request.head.ref == 'release-please--branches--main--components--rivet') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
        env:
          # Works once the public repository is selected; no guessed org/domain.
          RIVET_DOCS_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
