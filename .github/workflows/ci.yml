name: Verify Rivet

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: npm run docs:build
      - name: Evaluate deterministic workflow mechanics
        timeout-minutes: 15
        run: npm run evals -- --mode=fixture
      - name: Verify global tarball and Git installation plus first use
        timeout-minutes: 10
        run: npm run package:smoke
      - name: Ensure committed distribution matches source
        run: git diff --exit-code -- dist
